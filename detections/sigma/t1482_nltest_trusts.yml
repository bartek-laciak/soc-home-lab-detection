title: Domain Trust Discovery via nltest
id: cab65629-f2ef-4f68-8389-b221f47b0c29
status: experimental
description: Detects domain trust enumeration with nltest, including a renamed binary (matches OriginalFileName).
references:
    - https://attack.mitre.org/techniques/T1482/
author: Bartek (SOC home lab)
date: 2026-10-06
tags:
    - attack.discovery
    - attack.t1482
logsource:
    category: process_creation
    product: windows
detection:
    selection_name:
        OriginalFileName: 'nltestrk.exe'
    selection_img:
        Image|endswith: '\nltest.exe'
    condition: 1 of selection_*
falsepositives:
    - Administrators checking domain trusts
level: medium
