title: Encoded PowerShell Command Line
id: cbd3bae1-8c53-4948-b647-1a2fe6d74908
status: experimental
description: Detects PowerShell started with -EncodedCommand in any shortened form (-e, -en, -enc ...) or the -ec alias.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: Bartek (SOC home lab)
date: 2026-10-06
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|re: '(?i)\s[-/](e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)\s'
    condition: all of selection_*
falsepositives:
    - Legitimate tooling that launches Base64-encoded PowerShell
level: high
